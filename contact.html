<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact Me</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="script.js"></script>
    <script src="load-components.js"></script>
    <style>
        body {
            font-family: "Helvetica";
            background: #21da52;
            height: 100%;
        }
    </style>
</head>
<header id="header"></header>

<main>
    <section class="mainContent contentPage">
        <form class="contact-form">
        <h2>Contact Me</h2>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject">

        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Send Message</button>
        </form>
    </section>
    
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2491.8905572458966!2d0.7111857765413041!3d51.349923071777894!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47df2b34bfee2f19%3A0x2f1c3afb6810c292!2sITonlinelearning!5e0!3m2!1sen!2suk!4v1740570257247!5m2!1sen!2suk" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</main>

<footer id="footer"></footer>
